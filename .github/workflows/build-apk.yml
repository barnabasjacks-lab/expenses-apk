name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version: $JAVA_VER"
          
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java verification successful: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "Checking for debug keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore successfully generated."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Searching app/build/outputs/apk for generated APK files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK at $APK_PATH is empty (0 bytes)."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $APK_PATH"
              exit 1
              ;;
          esac

          echo "APK verification successful: $APK_PATH exists, is non-empty, and has .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"

          if [ ! -s "$TMP_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to copy or prepared asset is empty."
            exit 1
          fi

          echo "Prepared release asset at: $TMP_DIR/app-debug.apk"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Verification ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK asset path is missing or invalid: $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK asset is empty."
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk. Found: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG"

          cat << 'EOF' > release_notes.md
### Automated Debug APK Build

- **Build Source:** GitHub Actions workflow
- **Run Number:** #${{ github.run_number }}
- **Run Attempt:** ${{ github.run_attempt }}
- **Source Commit SHA:** ${{ github.sha }}
- **Intended Use:** Testing and development verification
- **Production Status:** Not a Play Store production release
- **Signing:** Signed only with a temporary debug keystore.
EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes-file release_notes.md

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download Result Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release created successfully!"
            gh release view "$RELEASE_TAG" || true

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct APK Download URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Asset Name:** \`app-debug.apk\`"
              echo "- **Actions Backup Artifact:** \`app-debug-apk\` remains available under workflow run artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "Note: The debug APK was successfully built and uploaded as Actions artifact 'app-debug-apk'."
            fi
            {
              echo "## Release Publishing Warning"
              echo "GitHub Release publishing did not complete. If the APK built successfully, it remains available as a workflow artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
